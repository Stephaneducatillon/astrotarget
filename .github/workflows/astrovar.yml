# Construit AstroVar : APK Android + applications de bureau (Windows, Linux, macOS).
# Les fichiers produits sont téléchargeables dans l'onglet « Actions » (artefacts) ;
# un tag v* (ex. v1.0.0) publie en plus une Release GitHub.
name: AstroVar

on:
  push:
    paths: ['variable_stars/**', '.github/workflows/astrovar.yml']
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    working-directory: variable_stars

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: variable_stars/package-lock.json }
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: variable_stars/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Compilation de l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AstroVar.apk
      - uses: actions/upload-artifact@v4
        with: { name: AstroVar-android-apk, path: variable_stars/AstroVar.apk }

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: variable_stars/package-lock.json }
      - run: npm ci
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: AstroVar-${{ runner.os }}
          path: |
            variable_stars/dist/*.exe
            variable_stars/dist/*.AppImage
            variable_stars/dist/*.deb
            variable_stars/dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: 'artefacts/*' }
