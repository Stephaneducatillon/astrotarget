name: Application Android CielScore

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "tools/**"
      - "NGC.csv"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tools/**"
      - "NGC.csv"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Une seule construction a la fois par branche : un nouveau push annule celle
# qui la precede au lieu de s'empiler derriere. Evite les files d'attente qui
# se bloquent, et rend la derniere construction toujours prioritaire.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Lint et APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verification des catalogues generes
        run: |
          python3 tools/build_catalogs.py
          python3 tools/build_stars.py
          if ! git diff --quiet -- android/app/src/main/assets; then
            echo "Les catalogues embarques ne correspondent plus a NGC.csv." >&2
            echo "Relancez tools/build_catalogs.py et tools/build_stars.py, puis committez." >&2
            git --no-pager diff --stat -- android/app/src/main/assets
            exit 1
          fi

      - name: Validation du fichier des communes
        run: python3 tools/check_communes.py

      - name: Tests unitaires du moteur de calcul
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Analyse Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Construction de l'APK de debogage
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Construction de l'APK de release signe
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verification de la signature
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK : $APK ($(du -h "$APK" | cut -f1))"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Publication de l'APK de debogage
        uses: actions/upload-artifact@v4
        with:
          name: cielscore-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publication de l'APK de release
        uses: actions/upload-artifact@v4
        with:
          name: cielscore-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      # Une Release donne un lien de telechargement direct et permanent, sans
      # compte GitHub ni decompression : c'est la voie a suivre pour installer
      # l'application sur un telephone.
      - name: Publication de la Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          NAME="cielscore-$VERSION.apk"
          cp "$APK" "$NAME"

          {
            echo "Application Android CielScore, version $VERSION."
            echo
            echo "**Telechargez \`$NAME\` ci-dessous**, puis ouvrez le fichier sur"
            echo "votre telephone. Android demandera d'autoriser l'installation depuis"
            echo "cette source, l'application ne venant pas du Play Store."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | $VERSION |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Taille | $(du -h "$NAME" | cut -f1) |"
            echo "| Android minimum | 8.0 (API 26) |"
            echo
            echo "Signe avec la cle de test du depot : les mises a jour s'installent"
            echo "par-dessus, sans desinstallation prealable."
            echo
            echo "Les fonctions IA et l'image du jour demandent une cle d'API,"
            echo "a renseigner dans l'onglet Profil. Le reste fonctionne sans."
          } > notes.md

          # La Release est recreee a chaque construction : le lien reste identique.
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "$NAME" \
            --title "CielScore $VERSION — derniere construction" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"

          echo "Telechargement direct :"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/$NAME"
