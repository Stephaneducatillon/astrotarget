name: Application Android CielScore

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "tools/**"
      - "NGC.csv"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tools/**"
      - "NGC.csv"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Tests unitaires et APK de debogage
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verification des catalogues generes
        run: |
          python3 tools/build_catalogs.py
          python3 tools/build_stars.py
          if ! git diff --quiet -- android/app/src/main/assets; then
            echo "Les catalogues embarques ne correspondent plus a NGC.csv." >&2
            echo "Relancez tools/build_catalogs.py et tools/build_stars.py, puis committez." >&2
            git --no-pager diff --stat -- android/app/src/main/assets
            exit 1
          fi

      - name: Validation du fichier des communes
        run: python3 tools/check_communes.py

      - name: Tests unitaires du moteur de calcul
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Analyse Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Construction de l'APK de debogage
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: cielscore-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
